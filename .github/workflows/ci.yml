name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build
      - run: npm run build:next
        env:
          ADMIN_UI_TOKEN: ci-test-token
          SESSION_SECRET: ci-test-session
          SUPABASE_URL: http://127.0.0.1:1
          SUPABASE_KEY: ci-test-key
          ICAL_MASTER_SECRET: ci-test-calendar
          CRON_SECRET_TOKEN: ci-test-cron
      - run: bash scripts/verify-database.sh
